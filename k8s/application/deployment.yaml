apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-kube-ops
  namespace: application
  labels:
    app: secure-kube-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-kube-ops
  template:
    metadata:
      labels:
        app: secure-kube-ops
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:                                   
        - name: ghcr-pull-secret
      containers:
        - name: secure-kube-ops-api
          image: ghcr.io/zinedinealvarez/secure-kube-ops:c8bb3311048aef2694adb3a5705e20916e58cff5
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 3000
